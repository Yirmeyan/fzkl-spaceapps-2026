[project]
name = "spherex-explorer"
version = "0.1.0"
description = "Service that reads SPHEREx exposures and serves aligned frames, spectra, candidates and catalogs. Written with AI assistants directed by the team: see the README of the repository."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "astropy>=8.0,<9",
    "fastapi>=0.115",
    "httpx2>=2.16",
    "numpy>=2.1",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spherex_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call S3 or IRSA are left out unless asked for: python -m pytest -m network
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: tests that call S3 or IRSA, run on demand only",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
