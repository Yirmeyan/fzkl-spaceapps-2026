name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

# id-token lets the job prove to Google Cloud that it runs in this repository.
# No key or password is stored in GitHub.
permissions:
  contents: read
  id-token: write

# One deployment at a time, in the order of the merges.
concurrency:
  group: deploy-service
  cancel-in-progress: false

env:
  SERVICE: spherex-explorer
  IMAGE_REPOSITORY: spherex-explorer
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  SPX_ALLOWED_ORIGINS: ${{ vars.SPX_ALLOWED_ORIGINS }}

jobs:
  service:
    name: service
    # Google Cloud only trusts the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deployment settings
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT SPX_ALLOWED_ORIGINS; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository variable ${name} is not set. See docs/deployment.md."
              missing=1
            fi
          done
          # The value is written to a YAML file below: refuse anything that is not a star or a plain list of origins.
          if ! printf '%s' "$SPX_ALLOWED_ORIGINS" | grep --quiet --extended-regexp '^(\*|https?://[A-Za-z0-9.:-]+(,https?://[A-Za-z0-9.:-]+)*)$'; then
            echo "::error::SPX_ALLOWED_ORIGINS must be * or origins separated by commas, without spaces or quotes. See docs/deployment.md."
            missing=1
          fi
          exit "$missing"

      - name: Name the image after the commit
        run: echo "IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/backend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build the container image
        run: docker build --tag "$IMAGE" backend

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Publish the image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
          docker push "$IMAGE"

      - name: Install the Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The settings of the service live here, so that a change goes through a pull request.
      # The variables travel in a file: the origin list holds commas, which a command line would split.
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          variables="${RUNNER_TEMP}/service-variables.yaml"
          {
            echo 'SPX_ENVIRONMENT: "production"'
            echo 'SPX_LOG_LEVEL: "INFO"'
            echo "SPX_ALLOWED_ORIGINS: \"${SPX_ALLOWED_ORIGINS}\""
            echo "SPX_JOURNAL_PROJECT: \"${GCP_PROJECT_ID}\""
          } > "$variables"
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --env-vars-file="$variables" \
            --cpu=2 \
            --memory=1Gi \
            --execution-environment=gen2 \
            --min-instances=1 \
            --max-instances=3 \
            --concurrency=80 \
            --timeout=60s \
            --cpu-boost \
            --update-labels="managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet
          url="$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Check the deployed service
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          url="${SERVICE_URL}/api/health"
          status="000"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --output health.json --write-out '%{http_code}' --max-time 20 "$url" || true)"
            if [ "$status" = "200" ] && jq --exit-status '.status == "ok"' health.json > /dev/null; then
              echo "The service is healthy: $(cat health.json)"
              echo "Deployed ${GITHUB_SHA} to ${SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status}"
            sleep 10
          done
          if [ "$status" = "403" ]; then
            echo "::error::The service answers 403: public access is not enabled. See docs/deployment.md."
          else
            echo "::error::No healthy answer from ${url}. Last status: ${status}."
          fi
          exit 1
